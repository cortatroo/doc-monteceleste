site_name: Documentação Typebot — CRM e TicketZ

theme:
  name: material
  language: pt-BR

nav:
  - Início: index.md
  - Fluxo Typebot + CRM + TicketZ: fluxo-typebot-crm.md

markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
