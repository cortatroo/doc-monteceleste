site_name: Documentação Servidor Monte Celeste

theme:
  name: material
  language: pt-BR

nav:
  - Início: index.md
  - Fluxo Typebot atendimento TicketZ: Documentacao_Typebot_Triagem.md
  - RAIO-X Técnico e Manual de Operação: RAIO_X_TECNICO_TICHATBOT_TICKETZ_PRO_2026-10-23.md
  - Documento Backup e restore: Documento backup e restore.md

markdown_extensions:
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
